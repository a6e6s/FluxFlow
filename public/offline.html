<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b111e" />
    <title>FluxFlow - Offline</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            box-sizing: border-box;
            background: #0b111e;
            color: #f8fafc;
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
            text-align: center;
        }
        h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.5rem; }
        p { color: #94a3b8; font-size: 0.875rem; margin: 0 0 1.5rem; }
        button {
            background: #0284c7;
            color: #fff;
            border: 0;
            border-radius: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            min-height: 44px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <h1>You're offline</h1>
        <p>FluxFlow needs a connection to load this page. Check your network and try again.</p>
        <button type="button" onclick="location.reload()">Retry</button>
    </main>
</body>
</html>
